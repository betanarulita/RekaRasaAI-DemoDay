services:
  - type: web
    name: rekarasa-ai-demoday
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DATABASE_PATH
        value: /var/data/rekarasa.sqlite3
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: MODEL
        value: openai/gpt-oss-20b
      - key: IMAGE_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: IMAGE_STORAGE_PATH
        value: /var/data/generated-images
    disk:
      name: rekarasa-data
      mountPath: /var/data
      sizeGB: 1
